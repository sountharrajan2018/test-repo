<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1f2328;
      --muted: #59636e;
      --accent: #2f6feb;
      --card: #ffffff;
      --border: #e3e3e0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --fg: #e6e8eb;
        --muted: #9aa4af;
        --accent: #5b9bff;
        --card: #171a21;
        --border: #2a2f38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    button {
      font: inherit;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #count { margin-left: 12px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World</h1>
    <p>A simple HTML page with a little bit of interactivity.</p>
    <button id="btn" type="button">Click me</button>
    <span id="count" aria-live="polite">Clicked 0 times</span>
  </main>
  <script>
    let clicks = 0;
    const count = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      clicks += 1;
      count.textContent = `Clicked ${clicks} time${clicks === 1 ? '' : 's'}`;
    });
  </script>
</body>
</html>
