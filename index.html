<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World</title>
  <meta name="color-scheme" content="light dark">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      transition: background var(--duration-base) var(--ease-standard),
                  color var(--duration-base) var(--ease-standard);
    }
    header {
      display: flex;
      justify-content: flex-end;
      padding: var(--space-4);
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: var(--space-4);
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: var(--space-8);
    }
    .eyebrow {
      margin: 0 0 var(--space-2);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-accent);
    }
    h1 {
      margin: 0 0 var(--space-3);
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 600;
      line-height: var(--leading-tight);
    }
    .lede {
      margin: 0 0 var(--space-8);
      color: var(--color-text-muted);
    }
    .counter {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-4);
    }
    .count {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
    }
    .count strong { color: var(--color-text); font-size: var(--text-lg); }
    @media (max-width: 480px) {
      .card { padding: var(--space-6); }
    }
  </style>
</head>
<body>
  <header>
    <fieldset class="theme-toggle">
      <legend>Color theme</legend>
      <input type="radio" name="theme" id="theme-light" value="light">
      <label for="theme-light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Light
      </label>
      <input type="radio" name="theme" id="theme-system" value="system">
      <label for="theme-system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        System
      </label>
      <input type="radio" name="theme" id="theme-dark" value="dark">
      <label for="theme-dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        Dark
      </label>
    </fieldset>
  </header>

  <main>
    <section class="card">
      <p class="eyebrow">test-repo</p>
      <h1>Hello, World</h1>
      <p class="lede">A simple page built on a small token-based design system, with light and dark themes.</p>
      <div class="counter">
        <button id="btn" class="btn" type="button">Click me</button>
        <button id="reset" class="btn btn-secondary" type="button">Reset</button>
        <span class="count" aria-live="polite">Clicked <strong id="count">0</strong> <span id="unit">times</span></span>
      </div>
    </section>
  </main>

  <script>
    let clicks = 0;
    const count = document.getElementById('count');
    const unit = document.getElementById('unit');
    function render() {
      count.textContent = clicks;
      unit.textContent = clicks === 1 ? 'time' : 'times';
    }
    document.getElementById('btn').addEventListener('click', () => { clicks += 1; render(); });
    document.getElementById('reset').addEventListener('click', () => { clicks = 0; render(); });
  </script>
</body>
</html>
